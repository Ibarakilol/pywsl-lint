[project]
name = "pywsl"
version = "0.1.0"
description = "Whitespace linter for Python — a port of bombsimon/wsl with Python-native rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pywsl contributors" }]
keywords = ["linter", "formatter", "whitespace", "wsl", "ruff", "style"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pywsl/pywsl"
Issues = "https://github.com/pywsl/pywsl/issues"

[project.scripts]
pywsl = "pywsl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywsl"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pywsl]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
case-max-lines = 0
cuddle-max-statements = 1
