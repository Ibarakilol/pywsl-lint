[project]
name = "pywsl-lint"
version = "0.1.0"
description = "Whitespace linter for Python — a port of bombsimon/wsl with Python-native rules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nikita Lopanov", email = "lopanovnikita0@gmail.com" }]
keywords = ["linter", "formatter", "whitespace", "wsl", "ruff", "style"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ibarakilol/pywsl-lint"
Repository = "https://github.com/Ibarakilol/pywsl-lint"
Issues = "https://github.com/Ibarakilol/pywsl-lint/issues"

[project.scripts]
pywsl-lint = "pywsl_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywsl_lint"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "R", "RUF"]

[tool.pywsl-lint]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
case-max-lines = 0
cuddle-max-statements = 1

[tool.ruff.lint.isort]
known-first-party = ["pywsl_lint"]
known-local-folder = ["conftest"]
