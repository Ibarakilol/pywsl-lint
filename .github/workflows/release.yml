name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Refuse to publish a version the tag does not name
        run: |
          version="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME carries version $tag, pyproject says $version" >&2
            exit 1
          fi

      - run: uv build

      - run: uv publish --trusted-publishing always
